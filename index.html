<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <meta name="description" content="MPB personal study and life planner">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <title>MPB — Master Planner Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark">M</div><div><b>MPB</b><small>MASTER PLANNER BOARD</small></div></div>
    <div class="profile-mini"><div class="avatar">MP</div><div><b>فضای شخصی من</b><small id="todayLabel">امروز</small></div></div>
    <nav id="mainNav">
      <button class="nav-item active" data-page="dashboard"><span>◫</span> داشبورد</button>
      <button class="nav-item" data-page="tasks"><span>☑</span> وظایف <em id="taskBadge">0</em></button>
      <button class="nav-item" data-page="calendar"><span>▦</span> تقویم و برنامه</button>
      <button class="nav-item" data-page="study"><span>◷</span> مطالعه و کنکور</button>
      <button class="nav-item" data-page="syllabus"><span>▥</span> بانک مباحث و بودجه‌بندی</button>
      <button class="nav-item" data-page="weekly"><span>▦</span> برنامه هفتگی</button>
      <button class="nav-item" data-page="testlog"><span>⌁</span> تحلیل تست‌ها</button>
      <button class="nav-item" data-page="exams"><span>▤</span> آزمون‌ها و درصدها</button>
      <button class="nav-item" data-page="habits"><span>✳</span> عادت‌ها</button>
      <button class="nav-item" data-page="goals"><span>◎</span> اهداف</button>
      <button class="nav-item" data-page="flashcards"><span>▱</span> فلش‌کارت و مرور</button>
      <button class="nav-item" data-page="focus"><span>◉</span> تمرکز و پومودورو</button>
      <button class="nav-item" data-page="notes"><span>▧</span> یادداشت‌ها</button>
      <button class="nav-item" data-page="analytics"><span>⌁</span> تحلیل عملکرد</button>
      <button class="nav-item" data-page="smartplan"><span>✧</span> برنامه‌ریز هوشمند</button>
      <button class="nav-item" data-page="search"><span>⌕</span> جست‌وجوی سراسری</button>
      <button class="nav-item" data-page="achievements"><span>♜</span> دستاوردها و سطح</button>
      <button class="nav-item" data-page="reports"><span>▤</span> گزارش‌ها و خروجی</button>
      <button class="nav-item" data-page="workspace"><span>▣</span> میزکار شخصی</button>
      <button class="nav-item" data-page="reminders"><span>◉</span> یادآورها و اعلان‌ها</button>
      <button class="nav-item" data-page="settings"><span>⚙</span> تنظیمات و پشتیبان</button>
    </nav>
    <div class="sidebar-bottom"><div class="quote">«پیشرفت کوچک، اما پیوسته.»</div><small>MPB ULTIMATE · v8.0 PLUS</small></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn mobile-menu" id="menuToggle">☰</button>
      <div><div class="eyebrow" id="pageEyebrow">WORKSPACE / OVERVIEW</div><h1 id="pageTitle">داشبورد</h1></div>
      <div class="top-actions"><div class="date-chip" id="headerDate"></div><button class="icon-btn" id="quickAdd" title="افزودن سریع">＋</button></div>
    </header>
    <div id="pageContent"></div>
    <footer>MPB · اطلاعاتت روی همین دستگاه ذخیره می‌شود. نسخه ۷٫۰</footer>
  </main>
</div>
<div class="toast" id="toast"></div>
<div class="modal-backdrop" id="modalBackdrop"><section class="modal" id="modal"><div class="modal-head"><h2 id="modalTitle">افزودن</h2><button class="icon-btn" id="modalClose">×</button></div><div id="modalBody"></div></section></div>
<script src="app.js"></script>
</body>
</html>
